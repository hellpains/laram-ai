# Временный запуск на своём компьютере: сервис + бесплатный туннель Cloudflare с HTTPS-адресом вида
# https://случайные-слова.trycloudflare.com. Адрес меняется при каждом перезапуске туннеля.
# Запуск на Windows: двойной клик по start.bat

services:
  app:
    build:
      context: .
      args:
        BASE_IMAGE: mirror.gcr.io/library/python:3.12-slim
        WITH_GIGAAM: ${WITH_GIGAAM:-0}
        GIGAAM_MODEL: ${GIGAAM_MODEL:-v3_e2e_rnnt}
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - app-data:/data
    ports:
      - "127.0.0.1:8000:8000"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:8000
    depends_on:
      - app

volumes:
  app-data:
